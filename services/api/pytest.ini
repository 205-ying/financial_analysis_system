[pytest]
# pytest 配置

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = tests

# 添加选项
addopts =
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto
    --cov=app
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html:../../runtime/test-results/api/htmlcov
    --cov-report=xml:../../runtime/test-results/api/coverage.xml
    -p no:warnings

# 标记定义
markers =
    asyncio: 异步测试
    slow: 慢速测试
    integration: 集成测试
    unit: 单元测试

# 异步超时设置
asyncio_default_fixture_loop_scope = function
